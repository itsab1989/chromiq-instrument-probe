name: Build probe bundles

# Ready-to-run binaries (no Python needed) for Windows, Linux, and one
# universal macOS build. Push a version tag (e.g. v1.0.0) to build them and
# publish a release; workflow_dispatch just builds artifacts for testing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: chromiq-instrument-probe-linux
            universal: false
          - os: windows-latest
            asset: chromiq-instrument-probe-windows.exe
            universal: false
          # One fat binary for both Intel and Apple-Silicon Macs.
          - os: macos-15
            asset: chromiq-instrument-probe-macos
            universal: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: matrix.universal == false
        with:
          python-version: "3.12"

      # macOS: python.org's universal2 build, so PyInstaller can emit a
      # universal2 binary — the same approach ChromIQ uses. This script is
      # pure standard library, so there are no third-party wheels to fatten.
      - name: Set up universal2 Python (macOS)
        if: matrix.universal == true
        run: |
          curl -fsSL -o /tmp/python.pkg \
            "https://www.python.org/ftp/python/3.12.7/python-3.12.7-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.12/bin" >> "$GITHUB_PATH"

      - name: Install PyInstaller and pytest
        run: python3 -m pip install --upgrade pip pyinstaller pytest

      # The tests block every build, Windows included (2.0.1: the four that failed there
      # in the 2.0.0 run were made right for Windows).
      - name: Run the tests (made-up recordings only)
        run: python3 -m pytest -q

      - name: Build one-file executable
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then SEP=";"; else SEP=":"; fi
          DATA="chromiq_probe/sessions${SEP}chromiq_probe/sessions"
          if [ "${{ matrix.universal }}" = "true" ]; then
            pyinstaller --onefile --target-arch universal2 --add-data "$DATA" --name probe instrument_probe.py
          else
            pyinstaller --onefile --add-data "$DATA" --name probe instrument_probe.py
          fi

      - name: Name the artifact
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/probe.exe "out/${{ matrix.asset }}"
          else
            mv dist/probe "out/${{ matrix.asset }}"
            chmod +x "out/${{ matrix.asset }}"
          fi

      - name: Verify it really is universal2 (macOS)
        if: matrix.universal == true
        run: |
          lipo -info "out/${{ matrix.asset }}"
          lipo -info "out/${{ matrix.asset }}" | grep -q "x86_64 arm64" \
            || { echo "FAIL: binary is not universal2"; exit 1; }

      - name: Smoke-test the binary (must run and exit 0)
        shell: bash
        run: |
          # No instrument, no recording: the version, the built-in sessions
          # (proves the session files are inside the binary) and the help.
          "./out/${{ matrix.asset }}" --version
          "./out/${{ matrix.asset }}" --sessions | grep -q "short set"
          "./out/${{ matrix.asset }}" --help | grep -q -- "--check"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Also bundle the readable source (for people who prefer it)
        run: |
          pack="chromiq-instrument-probe-source"
          mkdir -p "$pack"
          cp -r instrument_probe.py chromiq_probe README.md CHANGELOG.md SCENARIOS.md SESSIONS.md \
            LICENSE Start-Windows.bat Start-macOS.command Start-Linux.sh docs "$pack/"
          find "$pack" -name "__pycache__" -prune -exec rm -rf {} +
          zip -r "artifacts/${pack}.zip" "$pack"
          ls -la artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            A read-only recording tool for colour measuring instruments of any
            kind. Run it while you use the maker's own program: it listens,
            keeps only your instrument's traffic, hides private details, and
            makes one SEND-THIS zip to check and send. It never sends anything
            to any device and uploads nothing.

            **Built and tested with made-up recordings only; not yet run with
            a real instrument.** What to record: SCENARIOS.md. How to run it
            on each system, and what it needs: README.md.

            | System | File |
            |--------|------|
            | Windows | `chromiq-instrument-probe-windows.exe` |
            | macOS (Intel **and** Apple Silicon) | `chromiq-instrument-probe-macos` |
            | Linux | `chromiq-instrument-probe-linux` |
            | any, from source (Python 3.8+) | `chromiq-instrument-probe-source.zip` |

            These builds are **not code-signed**, so your system warns you
            the first time.

            ---
            ☕ ChromIQ is free and always will be. If it's useful to you, a coffee is a kind way to say thanks. It is completely optional, and the app stays fully featured either way.

            [![Support ChromIQ on Ko-fi](https://ko-fi.com/img/githubbutton_sm.svg)](https://ko-fi.com/itsab1989)
