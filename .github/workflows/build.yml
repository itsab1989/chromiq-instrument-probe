name: Build probe bundles

# Ready-to-run binaries (no Python needed) for Windows, Linux, and one
# universal macOS build. Push a version tag (e.g. v1.0.0) to build them and
# publish a release; workflow_dispatch just builds artifacts for testing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: chromiq-instrument-probe-linux
            universal: false
          - os: windows-latest
            asset: chromiq-instrument-probe-windows.exe
            universal: false
          # One fat binary for both Intel and Apple-Silicon Macs.
          - os: macos-14
            asset: chromiq-instrument-probe-macos
            universal: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: matrix.universal == false
        with:
          python-version: "3.12"

      # macOS: python.org's universal2 build, so PyInstaller can emit a
      # universal2 binary — the same approach ChromIQ uses. This script is
      # pure standard library, so there are no third-party wheels to fatten.
      - name: Set up universal2 Python (macOS)
        if: matrix.universal == true
        run: |
          curl -fsSL -o /tmp/python.pkg \
            "https://www.python.org/ftp/python/3.12.7/python-3.12.7-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.12/bin" >> "$GITHUB_PATH"

      - name: Install PyInstaller
        run: python3 -m pip install --upgrade pip pyinstaller

      - name: Build one-file executable
        shell: bash
        run: |
          if [ "${{ matrix.universal }}" = "true" ]; then
            pyinstaller --onefile --target-arch universal2 --name probe instrument_probe.py
          else
            pyinstaller --onefile --name probe instrument_probe.py
          fi

      - name: Name the artifact
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/probe.exe "out/${{ matrix.asset }}"
          else
            mv dist/probe "out/${{ matrix.asset }}"
            chmod +x "out/${{ matrix.asset }}"
          fi

      - name: Verify it really is universal2 (macOS)
        if: matrix.universal == true
        run: |
          lipo -info "out/${{ matrix.asset }}"
          lipo -info "out/${{ matrix.asset }}" | grep -q "x86_64 arm64" \
            || { echo "FAIL: binary is not universal2"; exit 1; }

      - name: Smoke-test the binary (must run and exit 0)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # With no instrument and stdin closed it must still produce a report
          # and exit cleanly. The report is written next to the executable.
          "./out/${{ matrix.asset }}" --skip-annotate < /dev/null
          if ls out/chromiq-instrument-probe-*.txt >/dev/null 2>&1; then
            echo "report written OK"
          else
            echo "FAIL: no report produced"; exit 1
          fi

      - name: Smoke-test the binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $null | & ".\out\${{ matrix.asset }}" --skip-annotate
          if (Get-ChildItem "out\chromiq-instrument-probe-*.txt" -ErrorAction SilentlyContinue) {
            Write-Host "report written OK"
          } else {
            Write-Error "no report produced"; exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Also bundle the readable source (for people who prefer it)
        run: |
          pack="chromiq-instrument-probe-source"
          mkdir -p "$pack"
          cp instrument_probe.py README.md CHANGELOG.md LICENSE "$pack/"
          zip -r "artifacts/${pack}.zip" "$pack"
          ls -la artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            Read-only information collector for colour measuring instruments —
            spectrophotometers, colorimeters, scanning tables and chart readers.
            It tells you whether ArgyllCMS already supports your device, and
            gathers what would be needed to add support if it does not.

            **Just want to run it?** Download the file for your system:

            | System | File |
            |--------|------|
            | Windows | `chromiq-instrument-probe-windows.exe` |
            | macOS (Intel **and** Apple Silicon) | `chromiq-instrument-probe-macos` |
            | Linux | `chromiq-instrument-probe-linux` |

            No Python needed. It only **reads** information about connected
            hardware — it never sends anything to your instrument and cannot
            operate it.

            ### Running it on macOS or Linux

            Downloaded files aren't marked as runnable, so a plain double-click
            may appear to do nothing. On **macOS** try Finder first:
            **right-click** the file → **Open** → **Open** again. If that
            doesn't work — or you're on **Linux** — open Terminal and run:

            ```bash
            cd ~/Downloads
            chmod +x chromiq-instrument-probe-macos    # or ...-linux
            ./chromiq-instrument-probe-macos
            ```

            `chmod +x` just marks the file as runnable. On **Windows** simply
            double-click the `.exe` and choose **More info → Run anyway**.

            These builds are **not code-signed** (that needs a paid
            certificate), so your system will warn you once — that's expected.
            Prefer to read the source first? Grab
            `chromiq-instrument-probe-source.zip`.

            ---
            ☕ ChromIQ is free and always will be. If it's useful to you, a coffee is a kind way to say thanks — completely optional, and the app stays fully featured either way.

